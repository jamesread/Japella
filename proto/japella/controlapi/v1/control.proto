	string bot_id = 2;
	string conversation_key = 3;
	string content = 4;
}

message SendBotConversationMessageResponse {
	StandardResponse standard_response = 1;
}

// Client loads history with GetBotConversationMessages, then opens this stream with
// last_message_id set to the highest id it already has. The server polls the database
// and pushes new rows until the client disconnects.
message StreamBotConversationUpdatesRequest {
	string protocol = 1;
	string bot_id = 2;
	string conversation_key = 3;
	uint32 last_message_id = 4;
}

message StreamBotConversationUpdatesResponse {
	repeated BotConversationMessage new_messages = 1;
}

