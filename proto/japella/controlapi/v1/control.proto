message BotConversation {
	string key = 1; // Internal conversation key
	string title = 2; // Display name (usually sender)
	string last_message = 3;
	string last_direction = 4; // incoming|outgoing
	int64 last_message_at_unix = 5;
}

message GetBotConversationsResponse {
	repeated BotConversation conversations = 1;
}

message GetBotConversationMessagesRequest {
	string protocol = 1;
	string bot_id = 2;
	string conversation_key = 3;
	uint32 limit = 4;
}

message BotConversationMessage {
	uint32 id = 1;
	string author = 2;
	string content = 3;
	string direction = 4; // incoming|outgoing
	string channel = 5;
	string message_id = 6;
	int64 timestamp_unix = 7;
}

message GetBotConversationMessagesResponse {
	repeated BotConversationMessage messages = 1;
}

