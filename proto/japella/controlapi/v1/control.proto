message GetFeedRequest {
}

message GetFeedResponse {
	repeated FeedPost posts = 1;
}

message FeedPost {
	uint32 id = 1;
	uint32 social_account_id = 2;
	string social_account_icon = 3;
	string social_account_identity = 4;
	string content = 5;
	string posted_date = 6;
	string author_id = 7;
	string author_name = 8;
	string author_avatar_url = 15;
	string remote_url = 9;
	string remote_id = 10;
	string preview_url = 11;
	string preview_title = 12;
	string preview_description = 13;
	string preview_image_url = 14;
	string social_account_connector = 16;
	string original_author_id = 17;
	string original_author_name = 18;
	string original_author_avatar_url = 19;
	// The platform's language tag for the post (e.g. "en"); empty if unknown.
	string language = 20;
	// Full handles (e.g. "@alice@example.social") and web profile links,
	// for the author options dialog. Empty when the platform didn't say.
	string author_handle = 21;
	string author_profile_url = 22;
	string original_author_handle = 23;
	string original_author_profile_url = 24;
	// True when the post was written by someone other than the social account
	// it was fetched through.
	bool from_external_author = 25;
	// Like and comment state, as the social account sees the post. Counts are
	// as of the last fetch.
	string interaction_remote_id = 26;
	bool liked = 27;
	uint32 like_count = 28;
	uint32 reply_count = 29;
	// Whether the post's network supports liking / reading its thread here.
	bool can_like = 30;
	bool can_view_comments = 31;
	// Whether the social account can comment here, and already has.
	bool can_comment = 32;
	bool commented = 33;
	// The caller's internal Japella tags on this post (lowercase, no '#').
	repeated string tags = 34;
	// Whether the post can be reloaded from its network (RefreshPost).
	bool can_refresh = 35;
}

