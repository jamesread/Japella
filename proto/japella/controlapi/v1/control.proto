// Health checks (see service/internal/health). Admins only (system.settings).
message HealthIssue {
	int64 id = 1;
	string check_id = 2;
	string check_title = 3;
	string issue_key = 4;
	string severity = 5; // "info", "warning" or "error"
	string title = 6;
	string detail = 7;
	string link = 8; // Frontend path where the problem can be fixed; empty when none
	int64 first_seen_unix = 9;
	int64 last_seen_unix = 10;
	int32 occurrences = 11;
	int64 resolved_at_unix = 12; // 0 while open
	int64 acknowledged_at_unix = 13; // 0 when not acknowledged
}

message HealthCheckStatus {
	string check_id = 1;
	string title = 2;
	int64 last_run_unix = 3; // 0 when the check has not run yet
	int64 duration_ms = 4;
	string status = 5; // "ok", "failed" or "pending"
	string error = 6;
}

message ListHealthIssuesRequest {
	bool include_resolved = 1;
	bool include_acknowledged = 2;
}

message ListHealthIssuesResponse {
	repeated HealthIssue issues = 1;
	repeated HealthCheckStatus checks = 2;
}

// Counts of open, unacknowledged issues (for the sidebar badge).
message GetHealthSummaryRequest {}

message GetHealthSummaryResponse {
	int32 errors = 1;
	int32 warnings = 2;
	int32 infos = 3;
}

message RunHealthChecksRequest {
	string check_id = 1; // Empty runs every check
}

message RunHealthChecksResponse {
	repeated HealthCheckStatus checks = 1;
}

message AcknowledgeHealthIssueRequest {
	int64 id = 1;
	bool acknowledged = 2; // false un-acknowledges
}

message AcknowledgeHealthIssueResponse {}

