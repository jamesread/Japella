}

message GetPostResponse {
	PostStatus post = 1;
	// Approval fields are populated when post.state is pending_approval.
	uint32 approval_stage = 2;
	uint32 account_policy_id = 3;
	string account_policy_name = 4;
	string submission_source = 5;
	uint32 submitted_by_user_id = 6;
	string submitted_by_username = 7;
	bool can_approve = 8;
	bool can_reject = 9;
	// can_edit is true when the post is pending approval and the caller is the
	// submitter or a current-stage assignee (same people who can reject).
	bool can_edit = 10;
	string waiting_on = 11;
}

message UpdatePendingPostRequest {
	uint32 post_id = 1;
	string content = 2;
}

message UpdatePendingPostResponse {
	StandardResponse standard_response = 1;
	PostStatus post = 2;
}

message Webhook {
	uint32 id = 1;
	string url = 2;
	repeated string events = 3;
	bool enabled = 4;
	string created = 5;
	string updated = 6;
}

message ListWebhooksRequest {}

message ListWebhooksResponse {
	repeated Webhook webhooks = 1;
	repeated string events = 2;
}

message CreateWebhookRequest {
	string url = 1;
	string secret = 2;
	repeated string events = 3;
	bool enabled = 4;
}

message CreateWebhookResponse {
	uint32 id = 1;
}

message UpdateWebhookRequest {
	uint32 id = 1;
	string url = 2;
	string secret = 3;
	repeated string events = 4;
	bool enabled = 5;
}

message UpdateWebhookResponse {}

message DeleteWebhookRequest {
	uint32 id = 1;
}

message DeleteWebhookResponse {}

message BotWebhook {
	uint32 id = 1;
	string protocol = 2;
	string bot_id = 3;
	string bot_name = 4;
	string url = 5;
	bool enabled = 6;
}

message ListBotWebhooksRequest {}

message ListBotWebhooksResponse {
	repeated BotWebhook webhooks = 1;
}

