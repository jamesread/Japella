# Marketing screenshots, captured by `make` in this directory against the
# throwaway stack it starts (see Makefile / seed/).
#
# title/description/theme are not used by repo-helper; `make manifest` turns
# them into screenshot-manifest.yaml for indexers. Every section needs them.

[DEFAULT]
base_url = http://127.0.0.1:18380/
dir = .
width = 1280
height = 800
script = scripts/light.py, scripts/prepare.py
post_script_sleep = 1.5
theme = light
manifest_project = Japella
manifest_base_url = https://raw.githubusercontent.com/jamesread/Japella/main/var/marketing/screenshots/

[compose]
url = post
script = scripts/light.py, scripts/prepare.py, scripts/compose.py
title = Compose once, post everywhere
description = Write a post, pick the Mastodon, Bluesky, X, Facebook and Instagram accounts it should go to, and publish now, schedule it or save a draft.

[feed]
url = feed
# Wide enough for the feed and both search columns beside the sidebar.
width = 1760
height = 990
script = scripts/light.py, scripts/prepare.py, scripts/feed.py
title = Monitor multiple social feeds
description = Read your feed side by side with columns that follow a hashtag or a search, and keep track of posts with private tags such as to-reply.

[timeline]
url = timeline
script = scripts/light.py, scripts/prepare.py, scripts/timeline.py
title = Timeline
description = Every post you have published, scheduled or drafted, across all of your accounts, with its campaign and a link to the live post.

[calendar]
url = calendar
height = 1250
title = Content calendar
description = See what went out and what is coming up at a glance, so gaps and clashes in your posting schedule are easy to spot.

[approvals]
url = approvals
title = Approvals
description = Account policies can hold posts for review. Approvers see what is waiting for them and approve or reject it before anything is published.

[campaigns]
url = campaigns
title = Campaigns
description = Group related posts and accounts into campaigns, such as a product launch, and track how much has gone out for each one.

[social-accounts]
url = social-accounts
title = Social accounts
description = All of the accounts Japella can post to in one list, including who owns them, so teams can share accounts without sharing passwords.

# Dark variants last; the browser session (and localStorage) is shared.
[timeline-dark]
url = timeline
script = scripts/dark.py, scripts/prepare.py, scripts/timeline.py
theme = dark
title = Dark mode
description = Japella follows your light or dark preference, shown here on the timeline.
