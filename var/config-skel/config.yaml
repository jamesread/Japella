configVersion: 2

# Log level: panic, fatal, error, warn, info, debug, trace (default: info).
# Override with JAPELLA_LOG_LEVEL, or force debug with JAPELLA_DEBUG=true.
# For temporary subsystem debug (auth/feed/http), use Settings → Debug in the UI instead.
logLevel: info

database:
  host: mysql
  user: japella
  pass: password # sample password
  name: japella

# Optional HTTP authentication via httpauthshim (https://github.com/jamesread/httpauthshim).
# Omit or leave empty to use only Japella DB sessions and API keys.
# JWT identities are auto-created in the DB on first login (created_by: sso-autocreated).
# Other providers (headers, mTLS) must match an existing Japella username.
#
# Cloudflare Access JWT example:
# auth:
#   jwt:
#     certsUrl: "https://myteam.cloudflareaccess.com/cdn-cgi/access/certs"
#     issuer: "https://myteam.cloudflareaccess.com"
#     aud: "PASTE_APPLICATION_AUD_TAG_HERE"
#     claimUsername: "email"
#     header: "Cf-Access-Jwt-Assertion"
#     cookieName: "CF_Authorization"
#
# auth:
#   httpHeader:
#     username: "Remote-User"
#   mtls:
#     enabled: true
#     usernameFromCN: true
auth: {}
