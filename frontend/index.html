<!DOCTYPE html>

<html lang="en">
	<head>
		<meta charset = "UTF-8" />

		<title>Japella</title>

		<script>
			(function () {
				var key = 'picocrank-theme';
				var stored = localStorage.getItem(key);
				var theme = stored === 'light' || stored === 'dark'
					? stored
					: (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
				document.documentElement.setAttribute('data-theme', theme);
			})();
		</script>

		<link rel = "stylesheet" type = "text/css" href = "resources/stylesheets/main.css" />

		<link rel = "shortcut icon" href = "logo.png" />
		<link rel = "manifest" href = "/manifest.json" />

		<meta charset = "UTF-8" />
		<meta name = "viewport" content = "width=device-width, initial-scale=1.0" />
		<meta name = "theme-color" content = "#444" />
		<meta name = "mobile-web-app-capable" content = "yes" />
		<meta name = "apple-mobile-web-app-status-bar-style" content = "default" />
		<meta name = "apple-mobile-web-app-title" content = "Japella" />
	</head>

	<body>
		<div id = "app" />

		<noscript>
			<p>Japella requires JavaScript to run. Please enable JavaScript in your browser settings.</p>
		</noscript>

		<script type = "module">
			import { main } from "./resources/javascript/main.ts";
			main()
		</script>
	</body>
</html>
